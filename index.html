<!DOCTYPE html>
<html>
<head>
  <style>
    /* NOTION-STYLE CSS */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: transparent;
      margin: 0;
      padding: 20px;
      color: #37352f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { font-size: 1.5rem; margin: 0 0 10px 0; }
    p { font-size: 0.9rem; color: #787c7e; margin: 0 0 20px 0; }

    /* LAYOUT CONTAINER (Side-by-Side) */
    #main-container {
      display: flex;
      flex-direction: row; /* Puts items side by side */
      align-items: flex-start;
      gap: 30px; /* Space between grid and hints */
    }

    /* GRID STYLES */
    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .tile {
      width: 50px;
      height: 50px;
      border: 2px solid #d3d6da;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
    }

    /* COLORS */
    .correct { background-color: #6aaa64; color: white; border-color: #6aaa64; }
    .present { background-color: #c9b458; color: white; border-color: #c9b458; }
    .absent { background-color: #787c7e; color: white; border-color: #787c7e; }

    /* RIGHT COLUMN (HINTS) */
    #right-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 150px; /* Ensures hints don't get squished */
    }

    /* HINT TOGGLES */
    details {
      font-size: 0.9rem;
      color: #37352f;
      cursor: pointer;
      animation: fadeIn 0.5s ease;
    }
    summary {
      list-style: none;
      display: flex;
      align-items: center;
      font-weight: 500;
      color: #eb5757; /* Red color for attention */
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: "▶";
      font-size: 0.7rem;
      margin-right: 8px;
      transition: transform 0.2s;
    }
    details[open] summary::before { transform: rotate(90deg); }
    
    .hint-content {
      margin-top: 4px;
      padding-left: 18px;
      color: #555;
      font-style: italic;
      font-size: 0.85rem;
    }

    /* BIO REVEAL (Overlays everything on win) */
    #bio-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      background: white;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      z-index: 100;
      animation: popIn 0.5s ease;
    }
    .bio-text { text-align: left; line-height: 1.6; margin-top: 15px; }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      background: #37352f;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 600px) {
      #main-container { flex-direction: column; align-items: center; }
      #right-column { width: 100%; align-items: center; }
    }
  </style>
</head>
<body>

  <div id="game-header">
    <h2>Unlock My Bio</h2>
    <p>Guess the 5-letter word.</p>
  </div>

  <div id="main-container">
    <div id="grid" class="grid"></div>

    <div id="right-column">
      </div>
  </div>

  <div id="bio-overlay">
    <h2>🎉 You Unlocked It!</h2>
    <div class="bio-text">
      <p>Hi, I'm <strong>[Your Name]</strong>.</p>
      <p>I am a creative strategist based in NYC. I love building digital experiences that connect people.</p>
      </div>
    <a href="#" onclick="alert('Scroll down to see more!')" class="btn">Explore My Work</a>
  </div>

  <script>
    // --- CONFIGURATION ---
    const TARGET_WORD = "DREAM"; 
    
    // --- YOUR HINTS LIST ---
    // Add as many as you like. They appear in order (1st wrong guess = 1st hint).
    const HINTS = [
      "Hint 1: It happens at night...",
      "Hint 2: It starts with the letter D...",
      "Hint 3: Use the Sandman...",
      "Hint 4: Opposite of reality...",
      "Hint 5: Rhymes with Stream!"
    ];
    
    // --- GAME LOGIC ---
    const MAX_GUESSES = 6;
    let guesses = [];
    let currentGuess = "";
    let gameOver = false;
    let wrongGuessCount = 0;

    const grid = document.getElementById("grid");
    const rightCol = document.getElementById("right-column");
    const bio = document.getElementById("bio-overlay");
    const header = document.getElementById("game-header");
    const mainContainer = document.getElementById("main-container");

    function initGrid() {
      for (let i = 0; i < MAX_GUESSES; i++) {
        let row = document.createElement("div");
        row.className = "row";
        for (let j = 0; j < 5; j++) {
          let tile = document.createElement("div");
          tile.className = "tile";
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    // Add a new hint to the right column
    function addHint() {
      if (wrongGuessCount > HINTS.length) return; // No more hints defined
      
      const hintIndex = wrongGuessCount - 1;
      const hintText = HINTS[hintIndex];

      if (hintText) {
        const details = document.createElement("details");
        details.open = true; // Automatically open the hint? Set to false if you want them closed.
        
        const summary = document.createElement("summary");
        summary.textContent = "Hint " + (hintIndex + 1);
        
        const content = document.createElement("div");
        content.className = "hint-content";
        content.textContent = hintText;

        details.appendChild(summary);
        details.appendChild(content);
        rightCol.appendChild(details);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (gameOver) return;
      const key = e.key.toUpperCase();
      if (key === "ENTER") submitGuess();
      else if (key === "BACKSPACE") {
        currentGuess = currentGuess.slice(0, -1);
        updateGrid();
      } else if (/^[A-Z]$/.test(key) && currentGuess.length < 5) {
        currentGuess += key;
        updateGrid();
      }
    });

    function updateGrid() {
      const row = grid.children[guesses.length];
      for (let i = 0; i < 5; i++) {
        row.children[i].textContent = currentGuess[i] || "";
      }
    }

    function submitGuess() {
      if (currentGuess.length !== 5) return;
      const row = grid.children[guesses.length];
      const targetArr = TARGET_WORD.split("");
      const guessArr = currentGuess.split("");

      // Logic for colors
      guessArr.forEach((char, i) => {
        if (char === targetArr[i]) {
          row.children[i].classList.add("correct");
          targetArr[i] = null;
        }
      });
      guessArr.forEach((char, i) => {
        if (!row.children[i].classList.contains("correct") && targetArr.includes(char)) {
          row.children[i].classList.add("present");
          targetArr[targetArr.indexOf(char)] = null;
        } else if (!row.children[i].classList.contains("correct")) {
          row.children[i].classList.add("absent");
        }
      });

      if (currentGuess === TARGET_WORD) {
        gameOver = true;
        setTimeout(() => {
          bio.style.display = "block"; // Show Popup
        }, 800);
      } else {
        // WRONG GUESS -> SHOW NEXT HINT
        wrongGuessCount++;
        addHint();
        
        if (guesses.length === MAX_GUESSES - 1) {
          alert("Game Over! The word was " + TARGET_WORD);
          gameOver = true;
        }
      }
      guesses.push(currentGuess);
      currentGuess = "";
    }
    initGrid();
  </script>
</body>
</html>
