<!DOCTYPE html>
<html>
<head>
  <style>
    /* NOTION-STYLE CSS */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: transparent;
      margin: 0;
      padding: 20px;
      color: #37352f;
      display: flex;
      flex-direction: column;
      align-items: center; /* Centers everything horizontally */
      justify-content: center;
      min-height: 90vh;
    }

    /* HEADER - Explicitly centered */
    #game-header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
    }

    h2 { font-size: 1.8rem; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    p { font-size: 0.95rem; color: #787c7e; margin: 0; }

    /* LAYOUT CONTAINER */
    #main-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center; /* Keeps grid in middle */
      gap: 20px; 
      position: relative; /* Helps stabilize layout */
    }

    /* GRID STYLES */
    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .tile {
      width: 48px;
      height: 48px;
      border: 2px solid #d3d6da;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
    }

    /* COLORS */
    .correct { background-color: #6aaa64; color: white; border-color: #6aaa64; }
    .present { background-color: #c9b458; color: white; border-color: #c9b458; }
    .absent { background-color: #787c7e; color: white; border-color: #787c7e; }

    /* RIGHT COLUMN (HINTS) */
    #right-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* Removed min-width so it doesn't take up space when empty */
      max-width: 200px; 
    }

    /* HINT TOGGLES */
    details {
      font-size: 0.85rem;
      color: #37352f;
      cursor: pointer;
      animation: fadeIn 0.5s ease;
      white-space: nowrap; /* Keeps hints neat */
    }
    summary {
      list-style: none;
      display: flex;
      align-items: center;
      font-weight: 600;
      color: #eb5757;
    }
    summary::-webkit-details-marker { display: none; }
    
    .hint-content {
      margin-top: 4px;
      color: #555;
      font-style: italic;
      white-space: normal;
    }

    /* BIO POPUP */
    #bio-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      background: white;
      border: 1px solid #e1e1e1;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      z-index: 100;
      animation: popIn 0.5s ease;
    }
    .bio-text { text-align: left; line-height: 1.5; margin-top: 15px; font-size: 0.95rem; }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #37352f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }

    @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }

    /* MOBILE RESPONSIVE */
    @media (max-width: 500px) {
      #main-container { flex-direction: column; align-items: center; }
      #right-column { width: 100%; align-items: center; margin-top: 15px; }
      details { text-align: center; }
    }
  </style>
</head>
<body>

  <div id="game-header">
    <h2>Unlock My Bio</h2>
    <p>Guess the 5-letter word.</p>
  </div>

  <div id="main-container">
    <div id="grid" class="grid"></div>

    <div id="right-column"></div>
  </div>

  <div id="bio-overlay">
    <h2>🎉 You Unlocked It!</h2>
